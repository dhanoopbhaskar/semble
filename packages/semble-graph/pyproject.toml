[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "semble-graph"
version = "0.1.0"
description = "Deterministic code-graph sidecar for Semble"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["code-search", "code-graph", "call-graph", "mcp", "semble"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24.0",
    "orjson",
    "pathspec>=0.12",
    "semble-grammars>=0.1.2,<0.2",
    "tqdm>=4.60",
]

[project.optional-dependencies]
search = ["semble>=0.7,<0.8"]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9.0", "mypy>=1.0"]

[project.scripts]
semble-graph = "semble_graph.cli:main"

[project.urls]
"Repository" = "https://github.com/dhanoopbhaskar/semble"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["semble_graph*"]

[tool.setuptools.package-data]
semble_graph = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["ANN", "C90", "E", "F", "I", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
"benchmarks/*.py" = ["T20"]
"src/semble_graph/cli.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--tb=short", "--strict-markers"]
markers = ["contract: tests that exercise the Semble public API"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
